services:
  - type: web
    name: gst-shield-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: AI_PROVIDER
        value: "gemini"
      - key: AI_MODEL
        value: "gemini-flash-latest"
      - key: GEMINI_API_KEY
        sync: false
